# Automated updates for the only GitHub Actions pins in the fleet that a human wrote.
#
# The `github-actions` ecosystem was removed fleet-wide on 2026-09-01, correctly: Actions were
# disabled, the workflow files had been deleted, and nothing pinned an action. Actions became the
# fleet's CI on 2026-09-02, and this repository is where the two hand-written workflows live, so
# this is where the pins are.
#
# It is deliberately NOT restored in the 62 gated repositories, and that is not an oversight.
# Their `.github/workflows/gate.yaml` is GENERATED by
# `org-metadata/scripts/render-actions-callers.py`, which pins the reusable workflow by
# 40-character commit and whose `--check` mode fails the gate when a committed caller differs
# from what the contract renders. Dependabot editing that `@sha` would be indistinguishable from
# drift and would red every repository it touched. The renderer owns that pin; re-render to move
# it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
