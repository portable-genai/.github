# The fleet's one CI job definition. Every repository calls this; none reimplements it.
#
# This is the GitHub Actions executor for the same contract Cloud Build ran: the inputs below
# are the `GRC_*` variables `run-grc-ci` reads, one for one, and the script itself is unchanged
# and lives in the runner image. Changing what CI does means changing the runner or the policy
# that renders the callers -- never this file per repository, which is the failure that killed
# the previous generation of workflows.
#
# The gate runs via `docker run` rather than a `container:` job on purpose. A container job
# makes GitHub own the entrypoint and the workspace permissions; running the image directly
# reproduces Cloud Build exactly -- the checkout is mounted read-only to the runner's uid 10001,
# which is the case `run-grc-ci` already relocates around.
name: fleet-gate

on:
  workflow_call:
    inputs:
      runner_image:
        description: Expected image ID of the reviewed runner. Never a tag.
        type: string
        required: true
      runner_release_tag:
        description: Release in portable-genai/.github holding the runner archive.
        type: string
        required: true
      runner_archive_sha256:
        description: SHA-256 of that archive, checked before it is loaded.
        type: string
        required: true
      job_id:
        type: string
        required: true
      make_targets:
        description: Space-separated make targets.
        type: string
        default: ""
      dev_lockfile:
        type: string
        default: requirements-dev.lock
      editable_install:
        type: boolean
        default: true
      pythonpath:
        type: string
        default: ""
      extra_lockfiles:
        type: string
        default: ""
      extra_lockfiles_first:
        type: boolean
        default: false
      demo_browser_required:
        type: boolean
        default: false
      audit_lockfiles:
        type: string
        default: ""
      runtime_lockfile:
        type: string
        default: ""
      lint_gcp:
        type: boolean
        default: false
      lint_gcp_paths:
        type: string
        default: ""
      iap_matrix_path:
        type: string
        default: ""
      npm_directory:
        type: string
        default: ""
      npm_directory_first:
        type: boolean
        default: false
      terraform_directory:
        type: string
        default: ""
      terraform_test:
        type: boolean
        default: false
      timeout_minutes:
        # Cloud Build allowed 600s against a measured p90 of 2.0 min. Fifteen here is the same
        # judgement with headroom for a cold image pull, not a licence for a hung build.
        type: number
        default: 15

permissions:
  contents: read

jobs:
  gate:
    name: ${{ inputs.job_id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch, verify and load the reviewed runner image
        env:
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          RELEASE_TAG: ${{ inputs.runner_release_tag }}
          ARCHIVE_SHA: ${{ inputs.runner_archive_sha256 }}
        run: |
          set -euo pipefail
          # The image is distributed as a release asset because an organization GHCR package is
          # created private and no API can change that, so the fleet's public repositories could
          # never pull it. A release asset on a public repository is anonymously downloadable.
          #
          # Distribution changed; the refusal did not. A tag can move under a green build, so the
          # archive is checked against a pinned SHA-256 BEFORE it is loaded, and the loaded image
          # is then checked against the pinned image ID. Either mismatch fails the build rather
          # than running something nobody reviewed.
          case "$RUNNER_IMAGE" in
            sha256:*) ;;
            *) echo "runner_image must be a sha256: image id, got: $RUNNER_IMAGE" >&2; exit 2 ;;
          esac
          case "$ARCHIVE_SHA" in
            ????????????????????????????????????????????????????????????????) ;;
            *) echo "runner_archive_sha256 must be 64 hex characters" >&2; exit 2 ;;
          esac
          archive="ci-runner.tar.gz"
          url="https://github.com/portable-genai/.github/releases/download/${RELEASE_TAG}/ci-runner-${RELEASE_TAG#runner-}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "$url"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$actual" != "$ARCHIVE_SHA" ]; then
            echo "runner archive sha256 mismatch: expected $ARCHIVE_SHA, got $actual" >&2
            exit 2
          fi
          docker load --input "$archive"
          if ! docker image inspect "$RUNNER_IMAGE" >/dev/null 2>&1; then
            echo "loaded archive does not contain the pinned image $RUNNER_IMAGE" >&2
            docker images --no-trunc --format '  present: {{.ID}} {{.Repository}}:{{.Tag}}' >&2
            exit 2
          fi
          echo "verified and loaded $RUNNER_IMAGE"

      - name: Run the gate
        env:
          RUNNER_IMAGE: ${{ inputs.runner_image }}
          GRC_JOB_ID: ${{ inputs.job_id }}
          GRC_MAKE_TARGETS: ${{ inputs.make_targets }}
          GRC_DEV_LOCKFILE: ${{ inputs.dev_lockfile }}
          GRC_EDITABLE_INSTALL: ${{ inputs.editable_install && 'true' || 'false' }}
          GRC_PYTHONPATH: ${{ inputs.pythonpath }}
          GRC_EXTRA_LOCKFILES: ${{ inputs.extra_lockfiles }}
          GRC_EXTRA_LOCKFILES_FIRST: ${{ inputs.extra_lockfiles_first && 'true' || 'false' }}
          GRC_DEMO_BROWSER_REQUIRED: ${{ inputs.demo_browser_required && 'true' || 'false' }}
          GRC_AUDIT_LOCKFILES: ${{ inputs.audit_lockfiles }}
          GRC_RUNTIME_LOCKFILE: ${{ inputs.runtime_lockfile }}
          GRC_LINT_GCP: ${{ inputs.lint_gcp && 'true' || 'false' }}
          GRC_LINT_GCP_PATHS: ${{ inputs.lint_gcp_paths }}
          GRC_IAP_MATRIX_PATH: ${{ inputs.iap_matrix_path }}
          GRC_NPM_DIRECTORY: ${{ inputs.npm_directory }}
          GRC_NPM_DIRECTORY_FIRST: ${{ inputs.npm_directory_first && 'true' || 'false' }}
          GRC_TERRAFORM_DIRECTORY: ${{ inputs.terraform_directory }}
          GRC_TERRAFORM_TEST: ${{ inputs.terraform_test && 'true' || 'false' }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --env "REPO_NAME=${GITHUB_REPOSITORY##*/}" \
            --env GRC_JOB_ID \
            --env GRC_MAKE_TARGETS \
            --env GRC_DEV_LOCKFILE \
            --env GRC_EDITABLE_INSTALL \
            --env GRC_PYTHONPATH \
            --env GRC_EXTRA_LOCKFILES \
            --env GRC_EXTRA_LOCKFILES_FIRST \
            --env GRC_DEMO_BROWSER_REQUIRED \
            --env GRC_AUDIT_LOCKFILES \
            --env GRC_RUNTIME_LOCKFILE \
            --env GRC_LINT_GCP \
            --env GRC_LINT_GCP_PATHS \
            --env GRC_IAP_MATRIX_PATH \
            --env GRC_NPM_DIRECTORY \
            --env GRC_NPM_DIRECTORY_FIRST \
            --env GRC_TERRAFORM_DIRECTORY \
            --env GRC_TERRAFORM_TEST \
            "$RUNNER_IMAGE"
