# Publishes the CI runner image the fleet's gate runs in, as a RELEASE ASSET rather than to a
# container registry.
#
# GHCR was the obvious home and it does not work here. An organization container package is
# created PRIVATE, and there is no REST route to change that: PATCH and PUT against every
# documented and undocumented visibility path return 404, both from a maintainer token and from
# a workflow GITHUB_TOKEN carrying packages:write. Visibility is settable only by hand in the
# web UI. An image the 62 public repositories cannot pull anonymously is an image the gate
# cannot use, and a pipeline that needs a human to click before it works is not a pipeline.
#
# A release asset on a public repository IS anonymously downloadable, so the gate stays
# self-sufficient. The reviewed bytes are unchanged: this saves the very image build-runner.sh
# smoke-tested, records its digest and the archive's SHA-256, and the gate refuses to run
# anything whose loaded digest is not the one pinned in its caller.
name: publish-runner

on:
  workflow_dispatch:
    inputs:
      runtime_key:
        description: Approved Python/Node pair.
        type: choice
        options:
          - python3.14-node24
          - python3.12-node20
        default: python3.14-node24

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the runner sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the reviewed base digests
        id: bases
        env:
          RUNTIME_KEY: ${{ inputs.runtime_key }}
        run: |
          set -euo pipefail
          # BASES.md is the record of WHICH digests were reviewed. Reading them from it rather
          # than from a workflow literal is the point of that file: the previous digests lived
          # only in the CI project's gitignored tfvars, so deleting the project destroyed them
          # and the rebuild had to re-derive them -- a new review decision wearing the clothes
          # of a restoration. A workflow literal would recreate that failure in a second place.
          py_v="${RUNTIME_KEY#python}"; py_v="${py_v%%-node*}"
          node_v="${RUNTIME_KEY##*-node}"
          py_digest="$(grep -oE "python:${py_v}-slim-bookworm\` \| \`sha256:[0-9a-f]{64}" ci/runner/BASES.md | grep -oE 'sha256:[0-9a-f]{64}' | head -1)"
          node_digest="$(grep -oE "node:${node_v}-bookworm-slim\` \| \`sha256:[0-9a-f]{64}" ci/runner/BASES.md | grep -oE 'sha256:[0-9a-f]{64}' | head -1)"
          test -n "$py_digest" || { echo "no reviewed python:${py_v} digest in BASES.md" >&2; exit 2; }
          test -n "$node_digest" || { echo "no reviewed node:${node_v} digest in BASES.md" >&2; exit 2; }
          echo "python_base=python:${py_v}-slim-bookworm@${py_digest}" >> "$GITHUB_OUTPUT"
          echo "node_base=node:${node_v}-bookworm-slim@${node_digest}" >> "$GITHUB_OUTPUT"

      - name: Build, smoke-test and push
        id: build
        env:
          RUNTIME_KEY: ${{ inputs.runtime_key }}
          PYTHON_BASE: ${{ steps.bases.outputs.python_base }}
          NODE_BASE: ${{ steps.bases.outputs.node_base }}
        run: |
          set -euo pipefail
          tag="staging-$(date -u +%Y%m%dT%H%M%SZ)"
          image="local/ci-runner-${RUNTIME_KEY}:${tag}"
          GRC_SKIP_PUSH=1 IMAGE_URI="$image" bash ci/runner/build-runner.sh
          # The image ID is the digest of the reviewed bytes. RepoDigests is empty for an image
          # that was never pushed, which is exactly the case now.
          digest="$(docker image inspect --format='{{.Id}}' "$image")"
          echo "local_tag=$image" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Runner built::$digest"

      - name: Save the image and publish it as a release asset
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_KEY: ${{ inputs.runtime_key }}
          LOCAL_TAG: ${{ steps.build.outputs.local_tag }}
        run: |
          set -euo pipefail
          archive="ci-runner-${RUNTIME_KEY}.tar.gz"
          docker save "$LOCAL_TAG" | gzip -1 > "$archive"
          sha="$(sha256sum "$archive" | cut -d" " -f1)"
          size="$(du -h "$archive" | cut -f1)"
          tag="runner-${RUNTIME_KEY}"
          # One rolling release per runtime key, replaced in place. The GATE never pins this
          # tag: it pins the image digest and verifies the archive's SHA-256, so a moved release
          # cannot silently change what a build runs -- it fails the check instead.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          printf '%s\n' \
            "image_digest: ${{ steps.build.outputs.image_digest }}" \
            "archive_sha256: ${sha}" \
            "Built from ci/runner at ${{ github.sha }}. The gate verifies both before running." \
            > notes.md
          gh release create "$tag" "$archive" \
            --title "CI runner ${RUNTIME_KEY}" --notes-file notes.md
          echo "archive_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "archive_size=$size" >> "$GITHUB_OUTPUT"

      - name: Report what to pin
        run: |
          {
            echo "### Runner published"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| \`runner_image\` | \`${{ steps.build.outputs.image_digest }}\` |"
            echo "| \`runner_archive_sha256\` | \`${{ steps.release.outputs.archive_sha256 }}\` |"
            echo "| archive size | ${{ steps.release.outputs.archive_size }} |"
            echo
            echo "Re-render the callers with these two values. The gate refuses any archive whose"
            echo "SHA-256 differs and any image whose loaded digest is not the one pinned."
          } >> "$GITHUB_STEP_SUMMARY"
